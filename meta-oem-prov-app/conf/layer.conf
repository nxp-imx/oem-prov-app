# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend"

BBFILE_COLLECTIONS += "meta-oem-prov-app"
BBFILE_PATTERN_meta-oem-prov-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-oem-prov-app = "6"

LAYERDEPENDS_meta-oem-prov-app = "core"
LAYERSERIES_COMPAT_meta-oem-prov-app = "styhead"
